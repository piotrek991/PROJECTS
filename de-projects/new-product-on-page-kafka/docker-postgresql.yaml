version: '3.8'
services:
  db:
    image: postgres:14.1-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=kafka-events
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - '5423:5432'
    volumes:
      - db:/var/lib/postgresql/data
      - ./postgres:/app/postgres
volumes:
  db:
    driver: local
